name: Bug Report
description: Create a report to help us reproduce and resolve a bug in HAWKLYX.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for reporting an issue!
        **SECURITY WARNING**: **DO NOT** paste real API keys, credentials, tokens, `.dev.vars`, `.env` files, keystore passwords, or personal secrets into this report, logs, or attached screenshots.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of HAWKLYX is experiencing the issue?
      options:
        - "Home-Screen Widget (Snapshot 3x2)"
        - "Home-Screen Widget (Intelligence 4x3)"
        - "Android Main App / UI"
        - "Market Session Calendar / Price Calculation"
        - "Cloudflare Worker Edge Service"
        - "Build / Toolchain / Gradle / Node"
        - "Documentation"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: "Describe what happened..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps are necessary to reproduce the behavior?
      placeholder: |
        1. Place widget on home screen
        2. Wait for background sync or tap refresh
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Expected price observation to update..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "Observed status badge displayed..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Provide device, OS, and toolchain information.
      placeholder: |
        - Device: [e.g., Google Pixel 8, Samsung Galaxy S24, Emulator]
        - Android Version: [e.g., Android 14, Android 15]
        - HAWKLYX Version / Commit: [e.g., 1.0.0, commit 14329e9]
        - Node / Wrangler (if backend): [e.g., Node 20.11, Wrangler 4.151.1]
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Stack Traces
      description: Paste any error logs, logcat output, or stack traces (sanitize all sensitive data first!).
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: "I have searched open and closed issues to ensure this is not a duplicate."
          required: true
        - label: "I have verified that no API keys, credentials, or private secrets are included in this report."
          required: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker:
    name: Cloudflare Worker Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/worker/package-lock.json'

      - name: Install dependencies
        working-directory: backend/worker
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: backend/worker
        run: npm run typecheck

      - name: Run Vitest test suites
        working-directory: backend/worker
        run: npm test

      - name: Audit dependency security
        working-directory: backend/worker
        run: npm audit --audit-level=high

      - name: Validate dry-run build
        working-directory: backend/worker
        run: npm run build

  android:
    name: Android Application Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Ensure Android SDK directory permissions
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK_DIR" ]; then
            sudo chown -R $USER:$USER "$SDK_DIR"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK Platform and Build Tools
        run: |
          yes | sdkmanager "build-tools;36.0.0" "platforms;android-37.0" --sdk_root="$ANDROID_HOME"

      - name: Verify Android SDK and Java Environment
        run: |
          echo "Verifying Java runtime..."
          java -version

          echo "Verifying Android SDK installation in $ANDROID_HOME..."

          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not set or directory does not exist: '$ANDROID_HOME'"
            exit 1
          fi

          # Verify required build tools (resolved by AGP 9.4.1)
          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "::error::Required Android SDK Build Tools 36.0.0 not found in $ANDROID_HOME/build-tools."
            echo "Available build tools in $ANDROID_HOME/build-tools:"
            ls -la "$ANDROID_HOME/build-tools" || true
            exit 1
          fi
          echo "Verified: Android SDK Build Tools 36.0.0 is present."

          # Verify required platform 37
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "::error::Required Android SDK Platform 37 not found in $ANDROID_HOME/platforms."
            echo "Available platforms in $ANDROID_HOME/platforms:"
            ls -la "$ANDROID_HOME/platforms" || true
            exit 1
          fi
          echo "Verified: Android SDK Platform 37 is present."

          echo "Android SDK and Java environment successfully verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew --no-daemon test

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
